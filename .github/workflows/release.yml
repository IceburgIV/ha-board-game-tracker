name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release archive
        run: |
          mkdir -p release
          cp -R custom_components release/
          cp README.md hacs.json release/
          cd release
          zip -r ../ha-board-game-tracker.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: ha-board-game-tracker.zip
          generate_release_notes: true
